<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;padding:56px 56px 48px;}
h2{font-size:38px;font-weight:800;color:#1a1a1a;margin-bottom:8px;}
.lead{font-size:24px;color:#7A8087;margin-bottom:36px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.card{border:2px solid #eef0f2;border-radius:14px;padding:28px 28px;background:#fff;}
.card .num{font-size:20px;font-weight:800;color:#F2644F;letter-spacing:1px;margin-bottom:10px;}
.card .t{font-size:30px;font-weight:800;color:#1a1a1a;margin-bottom:10px;}
.card .d{font-size:23px;color:#5a6068;line-height:1.5;}
.card.hot{border-color:#F2644F;background:#FFF7F5;}
.foot{margin-top:30px;font-size:22px;color:#A8ADB3;}
</style></head><body>
<h2>选题弹药的四个来源</h2>
<div class="lead">开工先盘点，不临时想——填满 15 个档期，还留备选</div>
<div class="grid">
  <div class="card hot"><div class="num">① 存量发布包</div><div class="t">9 月攒下的 48 个包</div><div class="d">写了一半、补全即发、过时需刷新的旧稿。选题已验证，最省力。</div></div>
  <div class="card"><div class="num">② 素材库 + 元宝卡</div><div class="t">平时随手存的料</div><div class="d">好观点、好案例分两类编号存着，排期直接挑，不临时找。</div></div>
  <div class="card"><div class="num">③ 舆情热点</div><div class="t">行业里刚发生的事</div><div class="d">官方自曝的工程事故这类，趁热写——时效本身就是流量。</div></div>
  <div class="card"><div class="num">④ 内容存货</div><div class="t">用不完的边角料</div><div class="d">写长了剩下的素材单独存着，到档期拼成一篇。</div></div>
</div>
<div class="foot">行途 · 发布工程化复盘</div>
</body></html>
