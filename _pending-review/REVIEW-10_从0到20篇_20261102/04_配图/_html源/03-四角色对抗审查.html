<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;padding:56px 56px 48px;}
h2{font-size:38px;font-weight:800;color:#1a1a1a;margin-bottom:8px;}
.lead{font-size:24px;color:#7A8087;margin-bottom:36px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.role{border:2px solid #eef0f2;border-radius:14px;padding:26px;display:flex;gap:20px;align-items:flex-start;}
.avatar{width:60px;height:60px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.role.hot .avatar{background:#F2644F;}
.role .t{font-size:28px;font-weight:800;color:#1a1a1a;margin-bottom:8px;}
.role .d{font-size:22px;color:#5a6068;line-height:1.5;}
.judge{margin-top:30px;background:#FFF7F5;border:2px solid #F2644F;border-radius:14px;padding:24px 28px;font-size:25px;color:#1a1a1a;line-height:1.5;}
.judge b{color:#F2644F;}
.foot{margin-top:26px;font-size:22px;color:#A8ADB3;}
</style></head><body>
<h2>四个角色，一桌杠精</h2>
<div class="lead">独立上下文，从各自刁钻角度开火，互不带偏</div>
<div class="grid">
  <div class="role"><div class="avatar">疑</div><div><div class="t">怀疑论者</div><div class="d">只找漏洞，不改建议：证据够吗？数字有源吗？漏了什么成本？</div></div></div>
  <div class="role"><div class="avatar">优</div><div><div class="t">优化者</div><div class="d">只提改进，不挑逻辑错：标题更抓人？有更省的写法吗？</div></div></div>
  <div class="role hot"><div class="avatar">审</div><div><div class="t">审计员</div><div class="d">只验数据，不做判断：数字对得上吗？来源真实吗？用脚本核。</div></div></div>
  <div class="role hot"><div class="avatar">滤</div><div><div class="t">过滤器</div><div class="d">只做减法，拦误报：这是真问题还是噪音？置信度够高吗？</div></div></div>
</div>
<div class="judge"><b>判据很硬：</b>同一个问题被 ≥2 个角色独立抓到，才算真问题。这一轮用脚本验证，不让 AI 当法官。</div>
<div class="foot">行途 · 发布工程化复盘</div>
</body></html>
