<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;padding:56px 56px 48px;}
h2{font-size:38px;font-weight:800;color:#1a1a1a;margin-bottom:8px;}
.lead{font-size:24px;color:#7A8087;margin-bottom:36px;}
.loop{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:34px;}
.node{border:2px solid #eef0f2;border-radius:12px;padding:20px 18px;text-align:center;width:200px;}
.node .t{font-size:23px;font-weight:800;color:#1a1a1a;line-height:1.3;}
.node.hot{border-color:#F2644F;background:#FFF7F5;}
.node.hot .t{color:#F2644F;}
.arr{font-size:26px;color:#F2644F;font-weight:800;}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.sk{border:2px solid #eef0f2;border-radius:10px;padding:16px 20px;font-size:22px;color:#2b2f36;}
.sk b{color:#1a1a1a;}
.sk .tag{color:#F2644F;font-weight:800;}
.foot{margin-top:26px;font-size:22px;color:#A8ADB3;}
</style></head><body>
<h2>为什么下一批会更快</h2>
<div class="lead">踩一个坑，不只是这篇改过来，而是封装成可复用的技能</div>
<div class="loop">
  <div class="node"><div class="t">踩坑<br>返工</div></div>
  <div class="arr">→</div>
  <div class="node hot"><div class="t">封装成<br>技能/模板/脚本</div></div>
  <div class="arr">→</div>
  <div class="node"><div class="t">下一篇<br>不再踩</div></div>
  <div class="arr">→</div>
  <div class="node hot"><div class="t">越跑<br>越快</div></div>
</div>
<div class="skills">
  <div class="sk"><span class="tag">新建</span> <b>成稿全流程</b> 技能</div>
  <div class="sk"><span class="tag">升级</span> <b>发布 SOP</b> 封面决策链</div>
  <div class="sk"><span class="tag">升级</span> <b>封面工具</b> 简笔画方向</div>
  <div class="sk"><span class="tag">升级</span> <b>信息图</b> HTML 覆字管线</div>
</div>
<div class="foot">判断标准：这个坑下一篇还会踩吗？会，就现在修好。</div>
</body></html>
