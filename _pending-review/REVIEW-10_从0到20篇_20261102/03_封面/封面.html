<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:766px;background:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden;}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.main{position:absolute;left:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:700px;z-index:2;}
h1{font-size:72px;font-weight:900;color:#FFFFFF;line-height:1.26;letter-spacing:0px;}
h1 .row{display:block;}
h1 .em{color:#F2644F;}
.redline{width:70px;height:6px;background:#F2644F;border-radius:3px;margin:30px 0 26px;}
.sub{font-size:30px;color:#9aa0a6;font-weight:600;letter-spacing:0px;}
.foot{position:absolute;left:110px;bottom:46px;font-size:26px;font-weight:700;color:#FFFFFF;letter-spacing:1px;z-index:2;}
.foot .em{color:#F2644F;}
</style></head><body>
<img class="bg" src="scene_base.png" alt="">
<div class="main">
  <h1><span class="row">从 <span class="em">0</span> 到 <span class="em">20</span> 篇</span><span class="row">发文搭成一条流水线</span></h1>
  <div class="redline"></div>
  <div class="sub">选题 / 成稿 / 门禁，串成传送带</div>
</div>
<div class="foot">不靠灵感，<span class="em">靠系统</span></div>
</body></html>
