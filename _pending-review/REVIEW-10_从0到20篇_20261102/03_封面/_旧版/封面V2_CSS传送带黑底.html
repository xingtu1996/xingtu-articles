<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:766px;background:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden;}
.main{position:absolute;left:130px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:1050px;}
.eyebrow{font-size:28px;font-weight:700;color:#F2644F;letter-spacing:4px;margin-bottom:38px;}
h1{font-size:78px;font-weight:800;color:#FFFFFF;line-height:1.22;letter-spacing:0px;}
h1 .row{display:block;}
h1 .em{color:#F2644F;}
.redline{width:64px;height:6px;background:#F2644F;border-radius:3px;margin:34px 0 26px;}
.sub{font-size:38px;color:#A8ADB3;font-weight:600;letter-spacing:1px;}
/* 右侧简笔画：流水线传送带 */
.lineart{position:absolute;right:90px;top:50%;transform:translateY(-50%);width:560px;height:420px;}
.belt{position:absolute;left:30px;top:250px;width:500px;height:0;border-top:4px solid #FFFFFF;}
.roller{position:absolute;top:250px;width:26px;height:26px;border:4px solid #FFFFFF;border-radius:50%;background:#1a1a1a;transform:translateY(-50%);}
.roller.hot{border-color:#F2644F;}
/* 传送带上的文档 */
.doc{position:absolute;width:74px;height:88px;border:4px solid #FFFFFF;border-radius:6px;background:#1a1a1a;}
.doc .ln{position:absolute;left:12px;right:12px;height:3px;background:#3a3f45;border-radius:2px;}
.doc .ln.o{background:#F2644F;width:26px;}
/* 终点：对勾文档 */
.done{position:absolute;right:-6px;top:150px;width:96px;height:116px;border:4px solid #F2644F;border-radius:6px;background:#1a1a1a;}
.done .check{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:40px;height:24px;border-left:5px solid #F2644F;border-bottom:5px solid #F2644F;transform:translateX(-50%) rotate(-45deg);}
.arrowup{position:absolute;right:60px;top:150px;width:4px;height:70px;background:#F2644F;}
.arrowup::after{content:"";position:absolute;top:-2px;left:-8px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #F2644F;}
</style></head><body>
<div class="main">
  <div class="eyebrow">10 月复盘</div>
  <h1><span class="row">一个月，从 <span class="em">0</span> 到</span><span class="row"><span class="em">20</span> 篇发文</span></h1>
  <div class="redline"></div>
  <div class="sub">把「发文」搭成一条流水线</div>
</div>
<div class="lineart">
  <div class="belt"></div>
  <div class="roller" style="left:44px"></div>
  <div class="roller hot" style="left:250px"></div>
  <div class="roller" style="left:470px"></div>
  <div class="doc" style="left:70px;top:150px"><div class="ln o" style="top:20px"></div><div class="ln" style="top:38px"></div><div class="ln" style="top:56px"></div></div>
  <div class="doc" style="left:230px;top:150px"><div class="ln o" style="top:20px"></div><div class="ln" style="top:38px"></div><div class="ln" style="top:56px"></div></div>
  <div class="doc" style="left:390px;top:150px"><div class="ln o" style="top:20px"></div><div class="ln" style="top:38px"></div><div class="ln" style="top:56px"></div></div>
  <div class="arrowup"></div>
  <div class="done"><div class="check"></div></div>
</div>
</body></html>
