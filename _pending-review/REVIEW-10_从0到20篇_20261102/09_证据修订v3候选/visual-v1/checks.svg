<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680"><rect width="100%" height="100%" fill="#F4F0E8"/><g font-family="PingFang SC,Microsoft YaHei,Heiti SC,sans-serif"><text x="42" y="64" font-size="33" fill="#222C30" font-weight="700">03  两道检查，回答不同问题</text><rect x="42" y="125" width="320" height="290" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><rect x="42" y="125" width="320" height="63" rx="10" fill="#243E38" stroke="#243E38"/><text x="65" y="167" font-size="29" fill="white" font-weight="600">形式检查</text><text x="65" y="238" font-size="23" fill="#34433E" font-weight="400">格式与可读性</text><text x="65" y="303" font-size="23" fill="#34433E" font-weight="400">隐私与引用</text><text x="65" y="368" font-size="23" fill="#34433E" font-weight="400">标题、正文、图片一致</text><rect x="398" y="125" width="320" height="290" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><rect x="398" y="125" width="320" height="63" rx="10" fill="#243E38" stroke="#243E38"/><text x="421" y="167" font-size="29" fill="white" font-weight="600">事实审查</text><text x="421" y="238" font-size="23" fill="#34433E" font-weight="400">数字的单位与时点</text><text x="421" y="303" font-size="23" fill="#34433E" font-weight="400">故事与原始记录</text><text x="421" y="368" font-size="23" fill="#34433E" font-weight="400">推断有没有越过证据</text><path d="M202 415L380 480" stroke="#B36B42" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M558 415L380 480" stroke="#B36B42" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="105" y="480" width="550" height="90" rx="10" fill="#E9DFCE" stroke="#D8CCB7"/><text x="140" y="535" font-size="30" fill="#222C30" font-weight="600">最后再问：符合本次意图吗？</text><text x="42" y="631" font-size="28" fill="#24473E" font-weight="600">检查通过，也可能做错了方向。</text></g></svg>