<svg xmlns="http://www.w3.org/2000/svg" width="760" height="715" viewBox="0 0 760 715"><rect width="100%" height="100%" fill="#F4F0E8"/><g font-family="PingFang SC,Microsoft YaHei,Heiti SC,sans-serif"><text x="42" y="64" font-size="34" fill="#222C30" font-weight="700">01  准备过，不等于做成了</text><text x="42" y="111" font-size="24" fill="#66736E" font-weight="400">状态每前进一步，都要有新的证据。</text><rect x="42" y="160" width="676" height="94" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="216" font-size="27" fill="#B36B42" font-weight="600">01</text><text x="130" y="203" font-size="29" fill="#222C30" font-weight="600">已有正文</text><text x="130" y="237" font-size="23" fill="#65706C" font-weight="400">正文文件与版本</text><path d="M380 254L380 275" stroke="#B36B42" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="42" y="275" width="676" height="94" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="331" font-size="27" fill="#B36B42" font-weight="600">02</text><text x="130" y="318" font-size="29" fill="#222C30" font-weight="600">已建草稿</text><text x="130" y="352" font-size="23" fill="#65706C" font-weight="400">草稿保存与内容回查</text><path d="M380 369L380 390" stroke="#B36B42" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="42" y="390" width="676" height="94" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="446" font-size="27" fill="#B36B42" font-weight="600">03</text><text x="130" y="433" font-size="29" fill="#222C30" font-weight="600">已安排发表</text><text x="130" y="467" font-size="23" fill="#65706C" font-weight="400">后台定时记录</text><path d="M380 484L380 505" stroke="#B36B42" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="42" y="505" width="676" height="94" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="561" font-size="27" fill="#B36B42" font-weight="600">04</text><text x="130" y="548" font-size="29" fill="#222C30" font-weight="600">已正式发表</text><text x="130" y="582" font-size="23" fill="#65706C" font-weight="400">正式链接、时间与状态</text><text x="43" y="672" font-size="28" fill="#24473E" font-weight="600">计划数量 ≠ 实际发表数量</text></g></svg>