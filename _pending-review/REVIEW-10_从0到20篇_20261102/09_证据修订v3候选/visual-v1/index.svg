<svg xmlns="http://www.w3.org/2000/svg" width="760" height="685" viewBox="0 0 760 685"><rect width="100%" height="100%" fill="#F4F0E8"/><g font-family="PingFang SC,Microsoft YaHei,Heiti SC,sans-serif"><text x="42" y="64" font-size="33" fill="#222C30" font-weight="700">02  索引指路，原文件保留事实</text><text x="42" y="111" font-size="24" fill="#66736E" font-weight="400">只读当前任务需要的材料。</text><rect x="42" y="162" width="676" height="95" rx="10" fill="#243E38" stroke="#243E38"/><text x="77" y="203" font-size="29" fill="#FFFDF8" font-weight="600">恢复入口</text><text x="77" y="237" font-size="24" fill="#E1E7DF" font-weight="400">这次做到哪了？下一步缺什么？</text><path d="M380 257L202 309" stroke="#C1BAAC" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="42" y="309" width="320" height="111" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="355" font-size="29" fill="#222C30" font-weight="600">事实与来源</text><text x="65" y="391" font-size="23" fill="#65706C" font-weight="400">数字、日期、证据</text><path d="M380 257L558 309" stroke="#C1BAAC" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="398" y="309" width="320" height="111" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="421" y="355" font-size="29" fill="#222C30" font-weight="600">有效决定</text><text x="421" y="391" font-size="23" fill="#65706C" font-weight="400">新决定覆盖什么</text><path d="M380 257L202 454" stroke="#C1BAAC" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="42" y="454" width="320" height="111" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="65" y="500" font-size="29" fill="#222C30" font-weight="600">当前任务</text><text x="65" y="536" font-size="23" fill="#65706C" font-weight="400">完成、待办、受限</text><path d="M380 257L558 454" stroke="#C1BAAC" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="398" y="454" width="320" height="111" rx="10" fill="#FFFDF8" stroke="#DDD7CA"/><text x="421" y="500" font-size="29" fill="#222C30" font-weight="600">执行记录</text><text x="421" y="536" font-size="23" fill="#65706C" font-weight="400">检查、结果、异常</text><text x="42" y="637" font-size="29" fill="#24473E" font-weight="600">入口要小，证据要能找回来。</text></g></svg>